<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found · Muhammad Nabiel Yandra</title>
    <link rel="preload" href="/fonts/big-shoulders-display-800-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Same paper, ink and type as the site (src/styles/tokens.css), kept by hand: this page is not part of the build -->
    <style>
      @font-face {
        font-family: 'Big Shoulders Display';
        font-weight: 800;
        font-display: swap;
        src: url('/fonts/big-shoulders-display-800-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Instrument Sans';
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/instrument-sans-latin.woff2') format('woff2');
      }
      :root {
        --paper: #f4efe6;
        --ink: #13213f;
        --accent: #e8641b;
      }
      [data-theme='dark'] {
        --paper: #0f1b33;
        --ink: #f1ebdd;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 1.25rem;
        padding: 2rem;
        font: 1rem/1.6 'Instrument Sans', system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      h1 {
        font: 800 clamp(6rem, 28vw, 14rem) / 0.85 'Big Shoulders Display', Impact, sans-serif;
      }
      h1 span {
        color: var(--accent);
      }
      p {
        max-width: 28rem;
      }
      a {
        justify-self: start;
        padding: 0.7rem 1.2rem;
        font-weight: 600;
        color: var(--paper);
        background: var(--ink);
        border-radius: 999px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
    <script>
      // the theme the visitor picked on the site, if any
      try {
        if (localStorage.getItem('theme-choice') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <h1>404<span>.</span></h1>
    <p>There is no page at this address. Everything on this site lives on one page, so the way back is short.</p>
    <p lang="id">Tidak ada halaman di alamat ini. Semua isi situs ini ada di satu halaman.</p>
    <a href="/">Back to the portfolio</a>
  </body>
</html>
