<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#F4EFE6" />

    <!-- Light by default. Only a theme the visitor picked with the switch is
         restored (before first paint, so there's no flash). The old 'theme'
         key was written on every visit to the previous site, so it's dropped. -->
    <script>
      try {
        localStorage.removeItem('theme')
        var picked = localStorage.getItem('theme-choice')
        if (picked === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F1B33')
        }
      } catch (e) {}
    </script>

    <title>Muhammad Nabiel Yandra Portfolio</title>
